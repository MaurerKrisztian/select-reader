# Builds the Select Reader installers on Linux and Windows. Each one is built on its
# own system: npm only installs the speech engine's native files for the system it
# runs on.
#
# - Push to main, or open a pull request: the installers are attached to the workflow
#   run as artifacts (Actions tab -> the run -> Artifacts).
# - Push a version tag (git tag v0.1.0 && git push origin v0.1.0): the installers are
#   also published as a GitHub release. Set the same version in package.json first.

name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          # macOS is optional and untested. Uncomment to build a .dmg too.
          # - os: macos-latest
          #   target: mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist:${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: select-reader-${{ matrix.target }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" installers/* --title "Select Reader $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
